[package]
name = "exmusic"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rodio = "0.21"
rustfft = "6.2"
md-5 = "0.10"
discord-rich-presence = "1.1"
rustfm-scrobble = "1.1"
souvlaki = "0.8"

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"